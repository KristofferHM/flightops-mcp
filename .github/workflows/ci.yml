name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  UV_VERSION: "0.11.19"

# Every third-party action is pinned to a commit, not a tag. A tag can be moved: in March 2026
# 76 of trivy-action's 77 tags were force-pushed to a credential stealer (CVE-2026-33634).
# The comment names the tag the commit was resolved from (git ls-remote, 2026-11-17).

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy src services agent evals dashboard

  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: Run the suite, with the coverage ratchet
        # `fail_under` in pyproject.toml is the floor; pytest-cov fails the step below it.
        run: |
          set -o pipefail
          uv run pytest -q -rs --cov --cov-report=term | tee pytest.out
        env:
          UV_PYTHON: ${{ matrix.python }}
          # 500 examples per property, derandomized (tests/conftest.py).
          HYPOTHESIS_PROFILE: ci
      - name: Fail on skipped tests
        # A skipped test is an untested path. Nothing here may skip silently.
        run: |
          # pytest says "N skipped"; coverage says "N files skipped due to complete coverage",
          # which is not a skipped test.
          if grep -qE "[0-9]+ skipped" pytest.out; then
            echo "::error::tests were skipped; account for them or remove them"
            exit 1
          fi
        env:
          UV_PYTHON: ${{ matrix.python }}

  # Phase 3's acceptance criteria, made mechanical. The offline backend has no model and no
  # network, but everything after the plan is real: tool dispatch over MCP, the token exchange,
  # the approval gate and the transcript. Each run is its own process with its own signing key,
  # so equal bytes here mean the transcript depends on the scenario and on nothing else.
  agent-offline:
    name: agent offline determinism (phase 3 acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen

      - name: Run one scenario twice, then three different ones
        run: |
          set -euo pipefail
          mkdir -p runs
          run() { uv run python -m agent run --scenario "$1" --backend offline --out "runs/$2.json" > "runs/$2.summary"; }
          run rebook-approved   approved-1
          run rebook-approved   approved-2
          run rebook-declined   declined
          run rebook-unanswered unanswered
          run rebook-replayed   replayed

      - name: Same scenario, same bytes; a different scenario, a different hash
        run: |
          set -euo pipefail
          first="$(uv run python -m agent hash runs/approved-1.json)"
          second="$(uv run python -m agent hash runs/approved-2.json)"
          other="$(uv run python -m agent hash runs/declined.json)"
          echo "rebook-approved, run 1: $first"
          echo "rebook-approved, run 2: $second"
          echo "rebook-declined:        $other"
          cmp runs/approved-1.json runs/approved-2.json
          test "$first" = "$second"
          # The check above cannot fail if the hash ignores the run. This one can.
          test "$first" != "$other"
          {
            echo '### Offline agent runs'
            echo '| scenario | content hash |'
            echo '|---|---|'
            echo "| rebook-approved (run 1) | \`$first\` |"
            echo "| rebook-approved (run 2) | \`$second\` |"
            echo "| rebook-declined | \`$other\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No approval, no write; a repeat is one write
        # Counted by the mock operations API (`ops_api` in the summary), not by the client.
        run: |
          set -euo pipefail
          count() { jq -c '.ops_api' "runs/$1.summary"; }
          echo "approved:   $(count approved-1)"
          echo "declined:   $(count declined)"
          echo "unanswered: $(count unanswered)"
          echo "replayed:   $(count replayed)"
          jq -e '.ops_api == {"rebooking_requests": 1, "rebookings_written": 1}' runs/approved-1.summary > /dev/null
          jq -e '.ops_api == {"rebooking_requests": 0, "rebookings_written": 0}' runs/declined.summary > /dev/null
          jq -e '.ops_api == {"rebooking_requests": 0, "rebookings_written": 0}' runs/unanswered.summary > /dev/null
          jq -e '.tools_called[-1] == "propose_rebooking"' runs/unanswered.summary > /dev/null
          jq -e '.ops_api == {"rebooking_requests": 2, "rebookings_written": 1}' runs/replayed.summary > /dev/null

      - name: Keep the transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-offline-transcripts
          path: runs/
          if-no-files-found: error

  # Phase 4's acceptance criteria, made mechanical. The golden scenarios are run against the real
  # stack with the scripted backend (no model, no network) and compared with the committed
  # baseline. The harness itself exits non-zero on a regression of more than 2 points, on a
  # scenario set the baseline was not recorded for, on a README table that is not what the
  # baseline renders to, and on a run longer than 60 s, so this job has no logic of its own.
  evals-offline:
    name: evals (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen

      - name: Run the golden scenarios against the committed baseline
        run: |
          set -euo pipefail
          mkdir -p eval-runs
          uv run python -m evals.run --offline \
            --out eval-runs/results.json \
            --table-out eval-runs/table.md \
            --transcripts eval-runs/transcripts | tee eval-runs/output.txt

      - name: Under 60 seconds, and the README table is the baseline's
        # The harness has already failed the step above if either were false. This states the
        # two numbers where a reader of the run will see them.
        run: |
          set -euo pipefail
          duration="$(jq -r '.duration_s' eval-runs/results.json)"
          echo "duration: ${duration} s (limit 60 s)"
          jq -e '.duration_s < 60 and .failures == []' eval-runs/results.json > /dev/null
          {
            echo '### Evals (offline)'
            echo
            cat eval-runs/table.md
            echo
            echo "Ran in ${duration} s (limit 60 s)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Broken scenarios fail the gate
        # The steps above cannot fail if the gate cannot. This one shows that it can. Two
        # expected answers are changed, not one: with this many scenarios one is worth less
        # than 2 points (docs/EVALS.md, "The gate"), and this step checks that the points rule
        # itself fires, as well as the scenario rule that would catch a single one.
        run: |
          set -euo pipefail
          cp -r evals/scenarios broken-scenarios
          for name in happy-weather-vfr happy-weather-lifr; do
            sed -i 's/^  answer: reported$/  answer: unknown/' "broken-scenarios/$name.yaml"
            ! cmp -s "evals/scenarios/$name.yaml" "broken-scenarios/$name.yaml"
          done
          if uv run python -m evals.run --offline --scenarios broken-scenarios > broken.out; then
            echo "::error::scenarios with broken expectations passed the gate"
            exit 1
          fi
          grep -E "^FAIL: outcome: .* points below the baseline" broken.out
          grep -E "^FAIL: scenarios: 2 now fail a check they passed in the baseline" broken.out

      - name: Keep the table, the results and the transcripts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evals-offline
          path: eval-runs/
          if-no-files-found: error

  # Phase 4b, gate 3 (docs/QUALITY.md). Mutants of auth/, the credit ledger, the agent's approval
  # types and the board's display rules, each run against the tests that exercise it. Linux only:
  # mutmut forks per mutant. The budget is the `timeout` below; a run it cuts short leaves mutants unchecked,
  # and the gate script fails on that rather than reporting a flattering lower bound.
  mutation:
    name: mutation (auth, credit ledger, approval, board)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # only to publish the rolling mutation-baseline release asset
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen

      - name: Mutate (budget 35 minutes)
        env:
          HYPOTHESIS_PROFILE: mutation
        run: |
          set +e
          timeout 35m uv run mutmut run --max-children 4 > mutmut.out 2>&1
          status=$?
          tail -n 20 mutmut.out
          echo "mutmut exited $status"

      - name: Survivors against the ceiling
        run: |
          set -o pipefail
          uv run python scripts/mutation_gate.py --report mutation-report.md | tee mutation-gate.out
          {
            echo '### Mutation testing'
            echo '```'
            cat mutation-gate.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: A ceiling one lower than the count fails the gate
        # The step above cannot fail if the gate cannot. Same results, one below the count that just passed.
        # Deliberately not a sample: every mutant of the real run is judged again, so the count compared is the
        # one that just passed, sitting exactly on the boundary. A re-run over one module would add mutation time
        # and prove less. Any sample would need at least one survivor, or `survivors > ceiling` could never be
        # true and a broken gate would pass.
        #
        # The ceiling to lower is the SURVIVOR COUNT, not the configured ceiling. Using the configured ceiling
        # assumed the count sits exactly on it, so a change that killed a survivor - an improvement - made this
        # step fail with "the gate passed with the ceiling at 99" and blocked the branch. Measured on
        # feat/upstream-time, run 44492695166.
        # No --report: the verdict needs no diffs, and reading them was this step's whole cost.
        run: |
          set -euo pipefail
          surviving="$(sed -n 's/^surviving: \([0-9]*\) (ceiling [0-9]*)$/\1/p' mutation-gate.out)"
          if [ -z "$surviving" ]; then
            echo "::error::could not read the survivor count out of mutation-gate.out"
            exit 1
          fi
          if [ "$surviving" -eq 0 ]; then
            echo "zero survivors: there is no ceiling below zero, so this step cannot prove the gate can fail."
            echo "::warning::mutation self-test skipped: no survivors to lower the ceiling under"
            exit 0
          fi
          lower=$((surviving - 1))
          sed "s/^ceiling = .*/ceiling = $lower/" pyproject.toml > lower.toml
          if uv run python scripts/mutation_gate.py --pyproject lower.toml > lower.out; then
            echo "::error::the gate passed with $surviving survivors and the ceiling at $lower"
            exit 1
          fi
          grep -E "^FAIL: $surviving mutants survived; the ceiling is $lower$" lower.out

      - name: Keep the survivor report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report
          path: |
            mutation-report.md
            mutmut.out
          if-no-files-found: warn

      - name: Keep mutmut's own cache
        # mutmut 3 has no `.mutmut-cache` file: its cache is the `mutants/` directory — one `.meta` per
        # mutated source carrying each mutant's verdict, plus `mutmut-stats.json`. A fork that restores
        # this directory gets every unchanged function skipped by hash and every changed one re-tested.
        # Uploaded on every run; published below only from main.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutmut-cache
          path: mutants/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish the cache as a rolling baseline
        # A release asset rather than a cross-repository artifact download: this repository is public, so
        # the consumer needs no token and no access grant to fetch it. `--clobber` makes it rolling, so the
        # asset always matches the newest main. The manifest is the other half: the hashes of every mutated
        # file and every selected test, so a consumer can tell whether the cache is a baseline for its tree.
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d mutants ]; then
            echo "::error::no mutants/ directory: the run produced no cache, so there is nothing to publish"
            exit 1
          fi
          tar czf mutants.tar.gz mutants
          uv run python scripts/mutation_baseline.py --manifest mutation-baseline.json
          gh release view mutation-baseline > /dev/null 2>&1 \
            || gh release create mutation-baseline \
                 --title "Mutation baseline (rolling)" \
                 --notes "mutmut's mutants/ directory from the newest run on main, and a manifest of the files it was made from. Restore the directory to skip mutants this run already judged; the hashes let a consumer refuse a cache made from a different tree."
          gh release upload mutation-baseline mutants.tar.gz mutation-baseline.json --clobber

  # The board's accessibility claim, enforced. A browser is the price: contrast, focus order and
  # sideways overflow only exist once a page is laid out, so no static check can see them.
  # Playwright and axe-core are pinned by scripts/package-lock.json, hashes included. No
  # --with-deps: its apt step took 5 min 18 s of a 6 min 47 s job (run 44395175602), and the
  # runner image already has what the headless shell needs. If that changes, launch fails loudly.
  a11y:
    name: accessibility (axe-core, two viewports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install
        run: uv sync --frozen
      - name: Install the pinned tools and their browser
        working-directory: scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --only-shell chromium
      - name: Walk the board's states
        run: |
          set -o pipefail
          node scripts/a11y.mjs | tee a11y.out
          {
            echo '### Accessibility'
            echo '```'
            cat a11y.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Phase 4b, gate 4. Secrets in the tree and in every commit on every ref, then known
  # vulnerabilities in the locked dependencies. A finding fails the job. The only allowlist is
  # .gitleaksignore, which names each verified false positive and why.
  scans:
    name: secret and dependency scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # From the release's gitleaks_8.30.1_checksums.txt.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history, not the default single commit: a secret removed in a later
          # commit is still in the repository.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      - name: gitleaks, working tree
        # Before `uv sync`, so the scan sees the checkout and not a virtualenv.
        run: ./gitleaks dir . --redact --no-banner --exit-code 1
      - name: gitleaks, every commit on every ref
        run: |
          set -euo pipefail
          ./gitleaks git . --log-opts=--all --redact --no-banner --exit-code 1 2>&1 | tee history.out
          echo "commits in the repository: $(git rev-list --all --count)"
          {
            echo '### gitleaks history'
            echo '```'
            grep -E "commits scanned|leaks found|no leaks" history.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: pip-audit, every locked dependency in every group
        run: |
          set -euo pipefail
          uv export --frozen --format requirements-txt --no-emit-project --all-groups > requirements.lock
          uv run --frozen pip-audit -r requirements.lock --disable-pip --progress-spinner off

  contract:
    name: live upstream contract (advisory)
    # The no-credential upstream only. OpenSky is rate-limited and may block
    # cloud IP ranges, so the paid/auth path is exercised locally, not here.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Ask AviationWeather.gov for a real METAR
        run: |
          uv run python - <<'PY'
          import asyncio, json, httpx
          async def main() -> None:
              async with httpx.AsyncClient(
                  timeout=30,
                  headers={"User-Agent": "flightops-mcp/ci (+https://github.com/KristofferHM/flightops-mcp)"},
              ) as client:
                  response = await client.get(
                      "https://aviationweather.gov/api/data/metar",
                      params={"ids": "ESGG", "format": "json"},
                  )
                  response.raise_for_status()
                  payload = response.json()
                  print(json.dumps(payload[0]["icaoId"]) if payload else "no data")
          asyncio.run(main())
          PY

  container:
    name: container build, smoke and image scan
    runs-on: ubuntu-latest
    env:
      # The binary, not trivy-action or setup-trivy, whose tags were rewritten in March 2026.
      # v0.69.3 is a version NVD names as known safe (CVE-2026-33634; v0.69.4 was the malicious
      # one). Pinned by hash, as gitleaks is. The hash was first observed by run 44162966637,
      # where it matched the release's own checksum file: trust on first use, not a second source.
      TRIVY_VERSION: "0.69.3"
      TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build --tag flightops-mcp:ci .
      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint python flightops-mcp:ci -c "
          import os, sqlite3, flightops_mcp.server as s
          assert s.mcp.name == 'flightops-mcp', s.mcp.name
          db = os.environ['FLIGHTOPS_AIRPORTS_DB']
          assert os.path.isfile(db), db
          count = sqlite3.connect(db).execute('select count(*) from airports').fetchone()[0]
          assert count > 0, 'airport reference database is empty'
          print(f'container ok: {count} airports baked in')
          "
      - name: CLI answers --help
        run: docker run --rm --entrypoint flightops-mcp flightops-mcp:ci --help
      - name: Container runs as non-root
        run: |
          user=$(docker run --rm --entrypoint id flightops-mcp:ci -un)
          echo "user: $user"
          test "$user" = "flightops"

      - name: Install trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" trivy
          ./trivy --version

      - name: Scan the shipped image
        # One scan, every severity, kept as the record. The gate below reads it.
        run: |
          set -euo pipefail
          ./trivy image --scanners vuln --format json --output trivy.json flightops-mcp:ci
          ./trivy convert --format table --output trivy.txt trivy.json
          tail -n 40 trivy.txt

      - name: Gate on fixable HIGH and CRITICAL
        # Unfixed findings are reported, not gated: nothing in this repository can act on
        # them, and a gate that is always red is a gate nobody reads.
        run: |
          set -euo pipefail
          gate() {
            jq '[.Results[]?.Vulnerabilities[]?
                 | select((.Severity == "HIGH" or .Severity == "CRITICAL") and ((.FixedVersion // "") != ""))]
                | length' "$1"
          }
          counts="$(jq -r '[.Results[]?.Vulnerabilities[]?.Severity] | group_by(.) | map("\(.[0]) \(length)") | join(", ")' trivy.json)"
          fixable="$(gate trivy.json)"
          {
            echo '### Image scan (trivy, flightops-mcp:ci)'
            echo "All findings by severity: ${counts:-none}"
            echo
            echo "Fixable HIGH or CRITICAL: ${fixable}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "all findings: ${counts:-none}; fixable HIGH/CRITICAL: ${fixable}"
          test "$fixable" -eq 0
          # The check above cannot fail if the gate cannot. One planted fixable HIGH must trip it.
          jq '.Results = [{"Vulnerabilities": [{"Severity": "HIGH", "FixedVersion": "1.0.1"}]}]' trivy.json > planted.json
          test "$(gate planted.json)" -eq 1

      - name: Keep the scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-scan
          path: |
            trivy.json
            trivy.txt
          if-no-files-found: warn

  # A separate job rather than more steps in `container`: that job needs no Python and answers in
  # about a minute ("does the image build and run as non-root"). This one builds three images,
  # starts a network and runs a 12-line matrix, so a failure here should name itself.
  compose-matrix:
    name: compose matrix (phase 1 acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The shipped stack plus the two things only the matrix needs, see the override's header.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install
        run: uv sync --frozen

      - name: Generate the client secrets into .env
        # The clients themselves (flightops-agent, flightops-mcp, resource
        # http://localhost:8000/mcp) are defined in docker-compose.yml; only the secrets are not.
        run: |
          umask 077
          for name in DEV_AGENT_CLIENT_SECRET DEV_MCP_CLIENT_SECRET MOCK_SCHIPHOL_CLIENT_SECRET; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> .env
          done

      - name: Check the shipped stack still does not publish the ops API
        # The override publishes it for the matrix. This keeps that from hiding a regression
        # in the file people actually run. Prints only the verdict, never the config.
        run: |
          set -euo pipefail
          COMPOSE_FILE=docker-compose.yml docker compose config --format json \
            | jq -e '(.services["ops-api"].ports // []) | length == 0' > /dev/null
          echo "ops-api publishes no port in docker-compose.yml"

      - name: Validate the merged compose config
        run: docker compose config --quiet

      - name: Bring the stack up and wait for the healthchecks
        run: docker compose up --build --wait --wait-timeout 240

      - name: Run the matrix against the stack
        # MATRIX_SERVER has no /mcp: the script appends it. It is `localhost` because tokens carry
        # the audience http://localhost:8000/mcp and the script mints for what it is pointed at.
        # The IdP and server logs are read from `docker compose logs`, i.e. from the services
        # themselves, which is what lines 8, 10 and 11 count.
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          export MATRIX_SERVER=http://localhost:8000
          export MATRIX_IDP=http://127.0.0.1:9000
          export MATRIX_OTHER_IDP=http://127.0.0.1:9001
          export MATRIX_OPS=http://127.0.0.1:9100
          export MATRIX_IDP_LOG_CMD="docker compose logs --no-color --no-log-prefix idp"
          export MATRIX_SERVER_LOG_CMD="docker compose logs --no-color --no-log-prefix server"
          uv run python scripts/local_matrix.py | tee matrix.out
          {
            echo '### Phase 1 matrix against docker compose'
            echo '```'
            cat matrix.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The second adapter through the stack, against the mock upstream
        # Schiphol's documented auth shape (audience, expiry), served by services/mock_upstream.
        # A scope refusal that reaches nothing, a debit the mock agrees with, no wrong audience,
        # no expired token, no retired header. A mock of the documentation, not Schiphol.
        run: |
          set -euo pipefail
          export MATRIX_SERVER=http://localhost:8000
          export MATRIX_IDP=http://127.0.0.1:9000
          export MATRIX_MOCK=http://127.0.0.1:9200
          uv run python scripts/second_upstream.py | tee second-upstream.out
          {
            echo '### Second adapter (Schiphol shape) against the mock upstream'
            echo '```'
            cat second-upstream.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Service logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
