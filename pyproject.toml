[project]
name = "flightops-mcp"
version = "0.3.0"
description = "A governed Model Context Protocol server for airline operations: OAuth2 M2M, credit-aware rate limiting, and PII-safe observability."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kristoffer Harr" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "agentic-ai", "aviation", "oauth2"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.28.1",
    # Pinned: the SDK auth surface is still moving. A bump is a deliberate change to auth/.
    "mcp[cli]==2.3.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "structlog>=26.1.0",
]

[project.scripts]
flightops-mcp = "flightops_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
    { include-group = "services" },
    { include-group = "agent" },
    { include-group = "evals" },
    { include-group = "dashboard" },
]
# The airport board. Not a runtime dependency of the server.
dashboard = [
    "fastapi>=0.163.0",
    "uvicorn>=0.54.0",
]
# The agent loop's model backends. Not a runtime dependency of the server, and
# the offline backend imports none of it: the SDK is loaded only when the
# `anthropic` backend is selected.
agent = [
    "anthropic>=2.9.0",
]
# The local IdP and the mock ops API. Not runtime dependencies of the server:
# they exist so the auth matrix can be tested without a cloud tenant.
services = [
    "fastapi>=0.163.0",
    "uvicorn>=0.54.0",
]
# The evaluation harness. Not a runtime dependency of the server: scenarios are
# YAML, and a tool call's arguments are checked against the schema the server
# published for it.
evals = [
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "C4", "RET", "ARG", "PL"]
ignore = [
    "S101",    # asserts are the test suite's whole point
    "PLR0913", # explicit dependency injection beats a god-object
    "PLR2004", # magic values are readable in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "ARG001", "ARG005", "PLC0415"]
"scripts/*" = ["PLC0415", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

# The ratchet (docs/QUALITY.md). Branch coverage over everything that ships or
# runs, scripts included. The floor is today's number rounded down and only ever
# goes up, in the same commit as the tests that raise it, never by excluding code.
[tool.coverage.run]
branch = true
source = ["src/flightops_mcp", "agent", "evals", "services", "scripts", "dashboard"]

[tool.coverage.report]
fail_under = 89
precision = 2
show_missing = true
skip_covered = true
# The whole exclusion list. Keep it this short: anything added here needs a line
# in docs/QUALITY.md saying why it cannot be tested.
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]

# Mutation testing (docs/QUALITY.md, section 3). CI only, on Linux: mutmut forks per
# mutant. Scoped to the code where a wrong answer is a security or money answer.
[tool.mutmut]
source_paths = ["src/", "agent/", "dashboard/"]
only_mutate = [
    "src/flightops_mcp/auth/*",
    "src/flightops_mcp/credits.py",
    "agent/approval.py",
    "dashboard/board.py",
]
also_copy = ["services/", "evals/", "scripts/", "data/"]
# The tests that exercise those modules, not the whole suite.
pytest_add_cli_args_test_selection = [
    "tests/test_approval.py",
    "tests/test_auth_verifier.py",
    "tests/test_obo.py",
    "tests/test_scopes.py",
    "tests/test_no_passthrough.py",
    "tests/test_rebooking_gate.py",
    "tests/test_idp.py",
    "tests/test_http_transport.py",
    "tests/test_opensky.py",
    "tests/test_server_tools.py",
    "tests/test_agent_offline.py",
    "tests/test_properties_scopes.py",
    "tests/test_properties_credits.py",
    "tests/test_jwks_contract.py",
    "tests/test_obo_contract.py",
    "tests/test_auth_contract.py",
    "tests/test_dashboard.py",
    # A static scan of the source text for clients without the passthrough guard. mutmut's
    # instrumented copy contains every mutant side by side, including those that drop the
    # guard, so the scan fails before any mutant runs. It still runs in the normal suite.
    "--deselect",
    "tests/test_no_passthrough.py::test_every_outbound_http_client_installs_the_guard",
]
pytest_add_cli_args = ["-p", "no:cacheprovider"]

# The survivor ceiling scripts/mutation_gate.py enforces: run 4 (CI 44121537739) left 90,
# each judged in docs/MUTATION-SURVIVORS.md. Lowered when a survivor is
# killed, never raised to let a new one through without a line in docs/QUALITY.md.
[tool.mutation-gate]
ceiling = 90
