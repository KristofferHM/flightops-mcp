id: absent-upstream-error-ops
group: absent-evidence
why: 'The operations API fails while reading the manifest: no count, so no proposal.'
question: SK1429 on 2026-11-16 is running late inbound. Move the passengers with tight connections
  to SK1431.
user:
  sub: dispatcher-3
  scopes:
  - flightops.reference.read
  - flightops.weather.read
  - flightops.passengers.read
  - flightops.rebooking.write
approval:
  action: accept
  approver: duty-manager-7
clock:
  start: '2026-11-16T09:00:00+00:00'
fixture:
  ops:
    passengers:
      status: 500
      json:
        error: internal
offline:
  policy: rebook_cohort
  params:
    from_flight: SK1429
    flight_date: '2026-11-16'
    to_flight: SK1431
    cohort: tight_connections
    reason_code: late_inbound
expect:
  tools:
    required:
    - flight_passenger_impact
  arguments:
    flight_passenger_impact:
      flight: SK1429
  answer:
  - refused
  - unknown
  absent_evidence: upstream_error
