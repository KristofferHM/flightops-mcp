id: happy-rebook-replayed
group: happy-path
why: 'The same proposal is submitted twice: the operations API writes it once.'
question: SK1429 on 2026-11-16 is running late inbound. Move the passengers with tight connections
  to SK1431. The first confirmation was lost; submit it again.
user:
  sub: dispatcher-3
  scopes:
  - flightops.reference.read
  - flightops.weather.read
  - flightops.passengers.read
  - flightops.rebooking.write
approval:
  action: accept
  approver: duty-manager-7
clock:
  start: '2026-11-16T09:00:00+00:00'
offline:
  policy: rebook_cohort
  params:
    from_flight: SK1429
    flight_date: '2026-11-16'
    to_flight: SK1431
    cohort: tight_connections
    reason_code: late_inbound
    submissions: 2
expect:
  tools:
    required:
    - flight_passenger_impact
    - propose_rebooking
  arguments:
    propose_rebooking:
      from_flight: SK1429
      flight_date: '2026-11-16'
      to_flight: SK1431
      cohort: tight_connections
      reason_code: late_inbound
      passenger_count: 2
  answer: executed
  writes: 1
