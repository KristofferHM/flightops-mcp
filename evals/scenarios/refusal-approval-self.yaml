id: refusal-approval-self
group: refusal
why: 'The proposer approves their own proposal: a second person is the whole point.'
question: SK1429 on 2026-11-16 is running late inbound. Move the passengers with tight connections
  to SK1431.
user:
  sub: dispatcher-3
  scopes:
  - flightops.reference.read
  - flightops.weather.read
  - flightops.passengers.read
  - flightops.rebooking.write
approval:
  action: accept
  approver: dispatcher-3
clock:
  start: '2026-11-16T09:00:00+00:00'
offline:
  policy: rebook_cohort
  params:
    from_flight: SK1429
    flight_date: '2026-11-16'
    to_flight: SK1431
    cohort: tight_connections
    reason_code: late_inbound
expect:
  tools:
    required:
    - flight_passenger_impact
    - propose_rebooking
  arguments:
    propose_rebooking:
      from_flight: SK1429
      flight_date: '2026-11-16'
      to_flight: SK1431
      cohort: tight_connections
      reason_code: late_inbound
      passenger_count: 2
  answer: refused
  refusal:
    kind: approval
    tool: propose_rebooking
    code: approver_is_proposer
