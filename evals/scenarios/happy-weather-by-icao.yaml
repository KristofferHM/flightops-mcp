id: happy-weather-by-icao
group: happy-path
why: 'The question already carries an ICAO code: weather is the call, resolving is optional.'
question: Give me the current weather picture for EKCH.
user:
  sub: dispatcher-3
  scopes:
  - flightops.reference.read
  - flightops.weather.read
clock:
  start: '2026-11-16T09:00:00+00:00'
fixture:
  weather:
    metar:
      status: 200
      json:
      - icaoId: EKCH
        reportTime: '2026-11-16T08:50:00Z'
        rawOb: EKCH 160850Z 24008KT 9999 BKN030 08/05 Q1008
        fltCat: VFR
        temp: 8
        dewp: 5
        wdir: 240
        wspd: 8
        visib: 6+
        altim: 1008
    taf:
      status: 200
      json:
      - icaoId: EKCH
        issueTime: '2026-11-16T08:30:00Z'
        rawTAF: TAF EKCH 160830Z 1609/1709 24010KT 9999 BKN030
offline:
  policy: airport_brief
  params:
    airport: EKCH
expect:
  tools:
    required:
    - airport_weather
    allowed:
    - resolve_airport
  arguments:
    airport_weather:
      airport: EKCH
  answer: reported
