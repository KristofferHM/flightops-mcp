id: refusal-credential-schiphol-audience
group: refusal
why: 'Schiphol''s token endpoint refuses the server''s client (wrong audience, or no subscription): a credential problem, not an empty schedule.'
question: What departures are due at Schiphol in the next hour?
user:
  sub: dispatcher-3
  scopes:
  - flightops.schedule.read
clock:
  start: '2026-11-16T09:00:00+00:00'
fixture:
  schiphol:
    token:
      status: 403
      json:
        error: access_denied
        error_description: Service not enabled within domain
offline:
  policy: schiphol_schedule
  params:
    direction: departure
    window_minutes: 60
expect:
  tools:
    required:
    - schiphol_flights
  arguments:
    schiphol_flights:
      direction: departure
      window_minutes: 60
  answer: refused
  refusal:
    kind: missing_credential
    tool: schiphol_flights
    code: upstream_auth_failed
