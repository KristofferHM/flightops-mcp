id: absent-unauthenticated-airspace
group: absent-evidence
why: 'With no OpenSky access the wide view cannot be read, and that is not an empty sky.'
question: What is flying over North America right now?
user:
  sub: dispatcher-3
  scopes:
  - flightops.traffic.read
clock:
  start: '2026-11-16T09:00:00+00:00'
fixture:
  opensky:
    credentials: false
