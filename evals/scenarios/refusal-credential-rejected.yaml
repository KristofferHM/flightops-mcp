  scopes:
  - flightops.reference.read
  - flightops.traffic.read
clock:
  start: '2026-11-16T09:00:00+00:00'
fixture:
  opensky:
    token:
      status: 401
      json:
        error: invalid_client
offline:
  policy: airport_traffic
  params:
    airport: ESGG
