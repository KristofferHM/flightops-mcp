name: flightops-mcp

# Local stack: the server in Streamable HTTP mode, the identity provider it
# trusts, and the internal API it calls on behalf of users. No cloud tenant and
# no external account are involved.
#
# Client secrets are not in this file. Generate them once into .env, which is
# never committed:
#
#   echo "DEV_AGENT_CLIENT_SECRET=$(openssl rand -hex 24)" >> .env
#   echo "DEV_MCP_CLIENT_SECRET=$(openssl rand -hex 24)" >> .env
#
# Container verification runs in CI; this file is what you would run on a host
# that has Docker installed.
services:
  # A test fixture, not an identity provider: /dev/user-token mints a token for
  # any user without a sign-in. Published on localhost only.
  idp:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["services.idp.app:create_app", "--port", "9000"]
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      # The name the server resolves inside the compose network. Tokens carry
      # it as `iss`, so it must match FLIGHTOPS_AUTH_ISSUER below exactly.
      IDP_ISSUER: http://idp:9000
      IDP_CLIENTS: >-
        [{"client_id": "flightops-agent",
          "client_secret": "${DEV_AGENT_CLIENT_SECRET:?generate one into .env, see the top of this file}",
          "app_roles": {"http://localhost:8000/mcp": [
            "flightops.reference.read", "flightops.weather.read",
            "flightops.traffic.read", "flightops.status.read"]}},
         {"client_id": "flightops-mcp",
          "client_secret": "${DEV_MCP_CLIENT_SECRET:?generate one into .env, see the top of this file}",
          "resource": "http://localhost:8000/mcp",
          "exchange_targets": {"api://flightops-ops": [
            "flightops.passengers.read", "flightops.rebooking.write"]}}]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:9000/.well-known/jwks.json', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  # The downstream of the on-behalf-of path. Holds invented, PII-shaped
  # passenger records and accepts only tokens exchanged for it. Not published
  # to the host: the only way in is through the server.
  ops-api:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["services.ops_api.app:create_app", "--port", "9100"]
    depends_on:
      idp:
        condition: service_healthy
    environment:
      OPS_ISSUER: http://idp:9000
      OPS_JWKS_URL: http://idp:9000/.well-known/jwks.json
      OPS_AUDIENCE: api://flightops-ops
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:9100/healthz', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      idp:
        condition: service_healthy
      ops-api:
        condition: service_healthy
    environment:
      FLIGHTOPS_LOG_LEVEL: INFO
      FLIGHTOPS_OPENSKY_CLIENT_ID: ${FLIGHTOPS_OPENSKY_CLIENT_ID:-}
      FLIGHTOPS_OPENSKY_CLIENT_SECRET: ${FLIGHTOPS_OPENSKY_CLIENT_SECRET:-}
      FLIGHTOPS_CREDIT_BUDGET_PER_HOUR: ${FLIGHTOPS_CREDIT_BUDGET_PER_HOUR:-400}
      # The HTTP transport refuses to start without an issuer: there is no
      # unauthenticated remote mode. This stack trusts the local IdP above.
      FLIGHTOPS_AUTH_ISSUER: http://idp:9000
      FLIGHTOPS_AUTH_JWKS_URL: http://idp:9000/.well-known/jwks.json
      # The URL clients use to reach the server, which is also the audience
      # tokens are issued for. Not the bind address.
      FLIGHTOPS_RESOURCE_SERVER_URL: http://localhost:8000/mcp
      # On-behalf-of: the server's own client at the IdP, used to exchange a
      # user's token for one the ops API accepts. The user's token is never
      # forwarded.
      FLIGHTOPS_AUTH_TOKEN_URL: http://idp:9000/token
      FLIGHTOPS_AUTH_CLIENT_ID: flightops-mcp
      FLIGHTOPS_AUTH_CLIENT_SECRET: ${DEV_MCP_CLIENT_SECRET:?generate one into .env, see the top of this file}
      FLIGHTOPS_OPS_API_BASE_URL: http://ops-api:9100
      FLIGHTOPS_OPS_API_AUDIENCE: api://flightops-ops
      # Observability. OTLP goes to the Jaeger collector below; the trace context
      # arrives from the client's `_meta` and is re-injected on every upstream call.
      # The exporter is overridable so a run without the observability profile does
      # not try to reach a collector that is not there.
      FLIGHTOPS_OTEL_EXPORTER: ${FLIGHTOPS_OTEL_EXPORTER:-otlp}
      FLIGHTOPS_OTEL_ENDPOINT: ${FLIGHTOPS_OTEL_ENDPOINT:-http://jaeger:4318/v1/traces}
      FLIGHTOPS_OTEL_ENVIRONMENT: compose
      FLIGHTOPS_BREAKER_FAILURE_THRESHOLD: ${FLIGHTOPS_BREAKER_FAILURE_THRESHOLD:-5}
      FLIGHTOPS_BREAKER_RECOVERY_TIMEOUT_S: ${FLIGHTOPS_BREAKER_RECOVERY_TIMEOUT_S:-30}
    # Secrets are passed by reference from the host environment or a .env file
    # that is never committed; nothing is baked into the image.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # /healthz is liveness only: it never touches an upstream, so a NOAA outage
      # cannot mark the container unhealthy.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --- observability ---------------------------------------------------------
  # Behind the `observability` profile, so `docker compose up` (and the CI matrix,
  # which uses the same file) starts only the services the acceptance criteria are
  # about. Turn it on with:
  #
  #   docker compose --profile observability up -d
  #
  # These images are pulled, not built here. Pin the tags deliberately; override
  # with JAEGER_TAG / PROMETHEUS_TAG / GRAFANA_TAG.
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:${JAEGER_TAG:-1.62}
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318" # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.0.1}
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:${GRAFANA_TAG:-11.3.0}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
